        fs: { align: one-high, job: { zone: deep-third, side: middle, part: middle } }
        nickel: { job: { zone: curl-flat, side: strong } }
        ss: { align: down, job: { zone: hook, side: strong } }
        mike: { job: { zone: hook, side: weak } }
        will: { align: apex, job: { zone: curl-flat, side: weak } }
      three-three-stack:
        cb-strong: { align: off-outside, job: { zone: deep-third, side: strong, part: outside } }
        cb-weak: { align: off-outside, job: { zone: deep-third, side: weak, part: outside } }
        fs: { align: one-high, job: { zone: deep-third, side: middle, part: middle } }
        oh-strong: { job: { zone: curl-flat, side: strong } }
