        ss: { align: two-high-low, job: { zone: deep-quarter, side: strong, part: inside } }
        fs: { align: two-high-low, job: { zone: deep-quarter, side: weak, part: inside } }
        sam: { align: apex, job: { zone: curl-flat, side: strong } }
