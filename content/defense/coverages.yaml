# Coverages: the shell before the snap, each defender's job after it, tells and rotations. Batch 2, signed off by the owner with defaults (2026-10-26).
# Sides (strong, weak) follow the defense's strength call (content/defense/fronts.yaml), set before any motion.
version: 1
batch: 2

# Shell (glossary): a defender at least high_depth deep at the snap is a high safety.
shells:
  high_depth: 9.5
  reviewed: true
  reviewer: owner
  reviewed_at: "2026-10-26"
# Pre-snap alignments for defensive backs and anyone whose coverage job sets where he stands.
#   cb alignments are measured from #1 on his side; leverage outside/inside puts him that many yards to that side.
#   one-high: the deep safety in the middle of the field. two-high: each safety on the hash on his side.
#   down: a safety 8 yd deep over the landmark (or man) of his job. over-man: on his receiver at depth, inside;
#     while his man runs a motion that crosses the formation (travel_for: motion path kinds) he follows at
#     travel_depth, behind the linebackers.
#   apex: a linebacker or overhang at the apex on his side (content/field/geometry.yaml), whatever the front says.
#   blitz: a defensive back with a rush job and no other alignment, this deep over his lane.
alignments:
  off-outside: { depth: 7, leverage: outside, offset: 1.0 }
  off-inside: { depth: 6, leverage: inside, offset: 1.0 }
  squat: { depth: 5, leverage: outside, offset: 1.5 }
  quarters: { depth: 7.5, leverage: outside, offset: 0.5 }
  press: { depth: 1.2, leverage: inside, offset: 0.7 }
  one-high: { depth: 12, at: middle-of-field }
  two-high: { depth: 12, at: hash }
  two-high-low: { depth: 10, at: hash }
  down: { depth: 8 }
  over-man: { depth: 5, leverage: inside, offset: 1.0, travel_depth: 7, travel_for: [jet, orbit, out-to-slot] }
  apex: { at: apex }
  blitz: { depth: 6 }
  reviewed: true
  reviewer: owner
  reviewed_at: "2026-10-26"
# Zone landmarks after the snap. by: seconds after the snap by which the defender must be there (the speed
# profiles have to make it reachable, or the play fails validation).
#   from_sideline: yards in from his sideline, but no more than max_outside_1 yd outside #1's alignment (a corner
#     over a tight #1 keeps him in front); middle-of-field: the centre between the sidelines;
#   end_man_to_1: fraction of the way from the end man on the line out to #1 on that side;
#   end_man_plus: yards outside the end man on the line.
zones:
  deep-third:   { term: deep-third, deep: true, depth: 14, by: 2.6, outside: { from_sideline: 8.9, max_outside_1: 5 }, middle: { at: middle-of-field } }
  deep-middle:  { term: one-high, deep: true, depth: 15, by: 2.4, middle: { at: middle-of-field } }
  deep-half:    { term: deep-half, deep: true, depth: 15, by: 2.6, outside: { from_sideline: 13.3 } }
  deep-quarter: { term: deep-quarter, deep: true, depth: 12, by: 2.4, outside: { from_sideline: 6.7, max_outside_1: 4 }, inside: { from_sideline: 20 } }
  curl-flat:    { term: curl-flat-zone, deep: false, depth: 7, by: 2.0, outside: { end_man_to_1: 0.65 } }
  flat:         { term: flat-defender, deep: false, depth: 6, by: 1.6, outside: { end_man_to_1: 1.0 } }
  hook:         { term: hook-zone, deep: false, depth: 9, by: 2.0, outside: { end_man_plus: 1.0 }, middle: { at: ball, depth: 10 } }
  hole:         { term: robber, deep: false, depth: 9, by: 1.8, middle: { at: ball } }

# Zone reaction after the drop. Each zone defender opens to his landmark; from react_after seconds after the
# snap he reads the receivers in his zone's area (half_width yards either side of the landmark, from from_depth
# to to_depth downfield) and plays the most dangerous one:
#   under:  the shallowest receiver in his zone (the next one to catch it in front of him, such as a flat route
#           or a crosser); he stays between the quarterback and him, cushion yards shallower (walls a crosser,
#           widens with a flat, sits under a curl), never shallower than min_depth or deeper than max_depth.
#           He only switches to another receiver when that one is switch_margin yards shallower. He comes up
#           shallower than his landmark only for a receiver running more across the field than up it (a crosser,
#           a flat, a settled curl); against a receiver running vertically he keeps his depth and sinks under him.
#           With one_each, he leaves a receiver a teammate underneath is already playing when another receiver is
#           in his zone (crossers are passed off, not doubled while someone runs free).
#   deeper: the deepest receiver in his zone; he stays cushion yards deeper, shading toward him by shade
# When the receiver leaves the area he passes him off and plays the next one, or goes back to his landmark.
zone_reaction:
  react_after: 0.6
  read_by: 1.0          # the invariant: every zone defender is reading by then (react_after may not be later)
  switch_margin: 1.5
  one_each: true
  zones:
    deep-third:   { half_width: 9, from_depth: 6, to_depth: 40, play: deeper, cushion: 3, shade: 0.5 }
    deep-middle:  { half_width: 9, from_depth: 6, to_depth: 40, play: deeper, cushion: 3, shade: 0.5 }
    deep-half:    { half_width: 13, from_depth: 6, to_depth: 40, play: deeper, cushion: 3, shade: 0.5 }
    deep-quarter: { half_width: 6.5, from_depth: 6, to_depth: 40, play: deeper, cushion: 3, shade: 0.6 }
    curl-flat:    { half_width: 6, from_depth: -1, to_depth: 13, play: under, cushion: 1.5, min_depth: 2.5, max_depth: 10 }
    flat:         { half_width: 5, from_depth: -1, to_depth: 9, play: under, cushion: 1.0, min_depth: 2.0, max_depth: 8 }
    hook:         { half_width: 5, from_depth: 0, to_depth: 15, play: under, cushion: 1.5, min_depth: 3.0, max_depth: 11 }
    hole:         { half_width: 6, from_depth: 0, to_depth: 14, play: under, cushion: 1.5, min_depth: 3.0, max_depth: 10 }
  reviewed: true
  reviewer: owner
  reviewed_at: "2026-10-26"
# Man coverage after the snap: he plays this far to the inside of his man, closing the cushion at close_rate yd/s
# down to min_cushion. A man defender whose man stays in to block becomes a green dog and rushes.
man:
  leverage: 1.0
  min_cushion: 1.0
  close_rate: 2.5
  green_dog: true
  reviewed: true
  reviewer: owner
  reviewed_at: "2026-10-26"
# Reaction to motion (PRD §6.6 tells): in man the defender on the motion man travels with him; in zone the
# defenders keyed to receivers re-align as the formation changes (bump). Fronts do not move with motion.
motion_response: { man: travel, zone: bump }

# Each coverage lists, per front, every non-lineman's job, plus any lineman who does not rush. Jobs:
#   { zone: <zone>, side: strong | weak | middle, part: outside | inside | middle }
#   { man: [keys], spare: [hole | rush] }   keys: strong-1..3, weak-1..3 (receivers counted from outside),
#                                           tight-end (an attached tight end), back (a back in the
#                                           backfield). The first free key is his man;
#                                           with none, he takes the first free spare job (one hole defender).
#   { rush: a | b | c | edge }                a blitz lane on his side
# align: an alignment above; default for linebackers and overhangs is the front's, for man defenders over-man.
# safety-field / safety-boundary: the safety on that side at the snap (with the ball in the middle, field means
#   the strong side). Use them where a job depends on field and boundary rather than strength.
# counts: deep and under zone defenders the coverage must have; rush where it is fixed.
# tells: before-snap movement { role, start (s before the snap), to: { depth } or { end_man_plus, depth }, kind }.
#   kind (batch 3, not yet reviewed): blitz-tell or rotation-tell, what the tell gives away.
coverages:
  - id: cover-0
    name: Cover 0
    tier: youth
    terms: [cover-0, zero-high, man-coverage, blitz]
    answer: cover-0          # the coverage he names after the snap
    family: man
    shell: { pre: zero-high, post: zero-high }
    tells:
      - { role: mike, start: 1.0, to: { depth: 3.0 }, kind: blitz-tell, honest: true }
      - { role: will, start: 1.0, to: { depth: 3.0 }, kind: blitz-tell, honest: true }
    fronts:
      four-two-five-even:
        cb-strong: { align: press, job: { man: [strong-1] } }
        cb-weak: { align: press, job: { man: [weak-1] } }
        nickel: { job: { man: [strong-2] } }
        mike: { job: { man: [back], spare: [rush] } }
        ss: { job: { man: [strong-3], spare: [rush] } }
        fs: { job: { man: [weak-2], spare: [rush] } }
        will: { job: { rush: a } }
      three-three-stack:
        cb-strong: { align: press, job: { man: [strong-1] } }
        cb-weak: { align: press, job: { man: [weak-1] } }
        sam: { job: { man: [tight-end, strong-3], spare: [rush] } }
        oh-strong: { job: { man: [strong-2], spare: [rush] } }
        oh-weak: { job: { man: [weak-2], spare: [rush] } }
        will: { job: { man: [back], spare: [rush] } }
        fs: { align: blitz, job: { rush: a } }
        mike: { job: { rush: a } }
    reviewed: true
    reviewer: owner
    reviewed_at: "2026-10-26"
  - id: cover-1
    name: Cover 1
    tier: youth
    terms: [cover-1, one-high, man-coverage, free-safety]
    answer: cover-1          # the coverage he names after the snap
    family: man
    shell: { pre: one-high, post: one-high }
    counts: { deep: 1 }
    fronts:
      four-three-over:
        cb-strong: { align: off-inside, job: { man: [strong-1] } }
        cb-weak: { align: off-inside, job: { man: [weak-1] } }
        fs: { align: one-high, job: { zone: deep-middle, side: middle } }
        ss: { align: down, job: { man: [strong-2] } }
        sam: { job: { man: [strong-3, back], spare: [rush] } }
        will: { job: { man: [weak-2, back], spare: [rush] } }
        mike: { job: { man: [back], spare: [hole, rush] } }
      four-two-five-even:
        cb-strong: { align: off-inside, job: { man: [strong-1] } }
        cb-weak: { align: off-inside, job: { man: [weak-1] } }
        fs: { align: one-high, job: { zone: deep-middle, side: middle } }
        nickel: { job: { man: [strong-2] } }
        ss: { align: down, job: { man: [strong-3], spare: [hole, rush] } }
        will: { job: { man: [weak-2, back], spare: [rush] } }
        mike: { job: { man: [back], spare: [hole, rush] } }
      three-three-stack:
        cb-strong: { align: off-inside, job: { man: [strong-1] } }
        cb-weak: { align: off-inside, job: { man: [weak-1] } }
        fs: { align: one-high, job: { zone: deep-middle, side: middle } }
        sam: { job: { man: [tight-end, strong-3, back], spare: [rush] } }
        oh-strong: { job: { man: [strong-2], spare: [rush] } }
        oh-weak: { job: { man: [weak-2], spare: [rush] } }
        will: { job: { man: [back], spare: [hole, rush] } }
        mike: { job: { man: [], spare: [hole, rush] } }
    reviewed: true
    reviewer: owner
    reviewed_at: "2026-10-26"
  - id: cover-2
    name: Cover 2
    tier: youth
    terms: [cover-2, two-high, deep-half, hook-zone, flat-defender]
    answer: cover-2          # the coverage he names after the snap
    family: zone
    shell: { pre: two-high, post: two-high }
    counts: { deep: 2, under: 5, rush: 4 }
    fronts:
      four-three-over:
        cb-strong: { align: squat, job: { zone: flat, side: strong } }
        cb-weak: { align: squat, job: { zone: flat, side: weak } }
        ss: { align: two-high, job: { zone: deep-half, side: strong } }
        fs: { align: two-high, job: { zone: deep-half, side: weak } }
        sam: { job: { zone: hook, side: strong } }
        mike: { job: { zone: hook, side: middle } }
        will: { job: { zone: hook, side: weak } }
      four-two-five-over: &cover-2-nickel
        cb-strong: { align: squat, job: { zone: flat, side: strong } }
        cb-weak: { align: squat, job: { zone: flat, side: weak } }
        ss: { align: two-high, job: { zone: deep-half, side: strong } }
        fs: { align: two-high, job: { zone: deep-half, side: weak } }
        nickel: { job: { zone: hook, side: strong } }
        mike: { job: { zone: hook, side: middle } }
        will: { job: { zone: hook, side: weak } }
      four-two-five-even: *cover-2-nickel
    reviewed: true
    reviewer: owner
    reviewed_at: "2026-10-26"
  - id: cover-3
    name: Cover 3
