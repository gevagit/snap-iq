# Pass concepts by receiver number (#1 widest). The concept side is the side the formation is written to (strong).
# by_count picks the routes for how many receivers stand there at the snap; weak gives the backside routes by
# number; back is the running back's route when the protection frees him. A formation whose counts are not listed
# does not fit the concept. A route can be shifted deeper: { route: shallow-route, deeper: 1 }.
# read.key is the defender the quarterback reads (a glossary term); read.progression lists routes in the order he
# looks at them. Batch 2, signed off by the owner with defaults (2026-10-26).
version: 1
batch: 2
concepts:
  - id: stick-concept
    name: Stick
    terms: [stick-concept, stick-route, flat-route, go-route]
    by_count:
      "3": { "1": go-route, "2": flat-route, "3": stick-route }
      "2": { "1": go-route, "2": stick-route }
    weak: { "1": hitch-route, "2": slant-route }
    back: flat-route
    read: { key: flat-defender, side: strong, progression: [flat-route, stick-route, hitch-route] }
    reviewed: true
    reviewer: owner
    reviewed_at: "2026-10-26"
  - id: slant-flat
    name: Slant-flat
    terms: [slant-flat, slant-route, flat-route]
    by_count:
      "3": { "1": slant-route, "2": flat-route, "3": seam-route }
      "2": { "1": slant-route, "2": flat-route }
    weak: { "1": slant-route, "2": flat-route }
    back: check-release
    read: { key: flat-defender, side: strong, progression: [slant-route, flat-route, check-release] }
    reviewed: true
    reviewer: owner
    reviewed_at: "2026-10-26"
  - id: smash
    name: Smash
    terms: [smash, hitch-route, corner-route]
    by_count:
      "3": { "1": hitch-route, "2": corner-route, "3": flat-route }
      "2": { "1": hitch-route, "2": corner-route }
    weak: { "1": hitch-route, "2": corner-route }
    back: check-release
    read: { key: cornerback, side: strong, progression: [corner-route, hitch-route, check-release] }
    reviewed: true
    reviewer: owner
    reviewed_at: "2026-10-26"
  - id: flood
    name: Flood
    terms: [flood, go-route, sail-route, flat-route, dig-route]
    by_count:
      "3": { "1": go-route, "2": sail-route, "3": flat-route }
      "2": { "1": go-route, "2": sail-route }
    weak: { "1": dig-route, "2": seam-route }
    back: flat-route
    read: { key: flat-defender, side: strong, progression: [sail-route, flat-route, dig-route] }
    reviewed: true
    reviewer: owner
    reviewed_at: "2026-10-26"
  - id: four-verticals
    name: Four verticals
    terms: [four-verticals, go-route, seam-route]
    by_count:
      "3": { "1": go-route, "2": seam-route, "3": seam-route }
      "2": { "1": go-route, "2": seam-route }
    weak: { "1": go-route, "2": seam-route }
    back: check-release
    read: { key: free-safety, side: middle, progression: [seam-route, go-route, check-release] }
    reviewed: true
    reviewer: owner
    reviewed_at: "2026-10-26"
  - id: mesh
    name: Mesh
    terms: [mesh, shallow-route, corner-route]
    by_count:
      "3": { "1": corner-route, "2": seam-route, "3": { route: shallow-route, deeper: 1 } }
      "2": { "1": corner-route, "2": { route: shallow-route, deeper: 1 } }
    weak: { "1": shallow-route, "2": shallow-route }
    back: swing-route
    read: { key: linebacker, side: middle, progression: [shallow-route, corner-route, swing-route] }
    reviewed: true
    reviewer: owner
    reviewed_at: "2026-10-26"
  - id: curl-flat
    name: Curl-flat
    terms: [curl-flat, curl-route, flat-route]
    by_count:
      "3": { "1": curl-route, "2": flat-route, "3": seam-route }
      "2": { "1": curl-route, "2": flat-route }
    weak: { "1": curl-route, "2": flat-route }
    back: check-release
    read: { key: flat-defender, side: strong, progression: [curl-route, flat-route, check-release] }
    reviewed: true
    reviewer: owner
    reviewed_at: "2026-10-26"