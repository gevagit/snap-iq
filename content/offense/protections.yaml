# Pass protections. Batch 2, not yet reviewed.
#   back: free          - no back stays in; a back in the backfield runs the concept's back route
#   back: check-release - he steps to his check point in his gap; he blocks a blitzer who comes there,
#                         otherwise he runs the check-release route (PRD §6.13)
#   back: pick-up       - he takes the first linebacker or defensive back to rush on his side
#   slide: away-from-back - the center and the linemen on that side block gaps toward it
version: 1
batch: 2
back_check_point: { outside_tackle: 0.4, depth: 2.4 }   # about 2 yd behind the line, off to his side
pass_set: { in_front_of_rusher: 0.7, help_depth: 1.6 }   # a blocker sets this far from his rusher toward the quarterback; a free lineman sets here
second_back: block   # a second back (the I-formation fullback) stays in and takes the first rusher on his side
protections:
  - { id: five-man, name: Five-man protection, terms: [five-man-protection], back: free, needs_back: false, reviewed: false }
  - { id: half-slide, name: Half-slide protection, terms: [half-slide, slide-protection, check-release], back: check-release, needs_back: true, slide: away-from-back, reviewed: false }
  - { id: big-on-big, name: Big-on-big protection, terms: [big-on-big, check-release], back: pick-up, needs_back: true, reviewed: false }
