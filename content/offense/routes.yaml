# Route waypoints, in yards from the receiver's alignment. x is toward his sideline (negative = toward the middle),
# y is downfield. The movement model (PRD §6.13) runs them at the receiver's speed profile. Batch 2, not yet reviewed.
version: 1
batch: 2
sideline_room: 1.5   # no route point closer than this to the sideline
routes:
  - { id: go-route, waypoints: [[0.5, 25]], quick: false, reviewed: false }
  - { id: fade-route, waypoints: [[1.5, 6], [3, 22]], quick: false, reviewed: false }
  - { id: seam-route, waypoints: [[-0.5, 25]], quick: false, reviewed: false }
  - { id: hitch-route, waypoints: [[0, 5.5], [-0.5, 4.8]], quick: true, reviewed: false }
  - { id: stick-route, waypoints: [[0.4, 6], [1.4, 6]], quick: true, reviewed: false }
  - { id: quick-out-route, waypoints: [[0, 5], [4, 5]], quick: true, reviewed: false }
  - { id: out-route, waypoints: [[0, 10], [5, 10]], quick: false, reviewed: false }
  - { id: slant-route, waypoints: [[0, 1.5], [-6, 7]], quick: true, reviewed: false }
  - { id: flat-route, waypoints: [[1.5, 1.5], [8, 3], [11, 3.3]], quick: true, reviewed: false }
  - { id: curl-route, waypoints: [[0, 12], [-1, 10.5]], quick: false, reviewed: false }
  - { id: dig-route, waypoints: [[0, 12], [-12, 12]], quick: false, reviewed: false }
  - { id: corner-route, waypoints: [[0, 10], [5, 16]], quick: false, reviewed: false }
  - { id: post-route, waypoints: [[0, 10], [-5, 17]], quick: false, reviewed: false }
  - { id: shallow-route, waypoints: [[-1, 2], [-16, 3.5]], quick: true, reviewed: false }
  - { id: sail-route, waypoints: [[0, 9], [4, 12], [8, 12.5]], quick: false, reviewed: false }
  - { id: swing-route, waypoints: [[2, 0], [7, 1.5]], quick: true, reviewed: false }
  - { id: check-release, waypoints: [[3, 2], [6, 4]], quick: true, check_seconds: 0.9, reviewed: false }
