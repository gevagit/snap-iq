# Rooftop Run (docs/plans/rooftop.md): the Pocket workout, owner's call 2026-10-31. Not football: a courier on neon
# rooftops at night dodges hunter drones and tosses packages to friends whose lanterns light up. The game's every
# number lives here, so the owner can tune it without touching code. Distances in metres, times in seconds.
# x runs across the view (+ to the right), z away from him (+ ahead).
version: 1

roof:
  half_width: 5        # his roof runs from -half_width to +half_width across
  back: -3             # and from back to front (z)
  gap: 7               # the jump to the next roof

courier:
  eye: 1.55            # eye height above his roof
  step: 0.9            # one tap (a key or a swipe) moves him this far; tap fast to go further
  dash: 8              # how fast he covers a step
  accel: 90            # how fast he gets going and stops
  tap_gap: 0.14        # the right play taps no faster than this (a person can tap about this fast)
  power_max: 1.8       # a sharp flick of the joystick: up to this many times a step, that much faster
  start: [0, -0.8]

# The protection (owner, 2026-11-01): his line in front of him, each with a strength rating 0-99, and his RB beside
# him on his blind side. A protector holds his drone in a beam for up to hold_max seconds (at 99), less the weaker he
# is; protectors get weaker as the levels rise. A spare protector helps on the nearest drone (double: + seconds).
protection:
  linemen: 5
  ahead: 2.4           # the line stands this far in front of him
  spacing: 1.2         # between linemen
  strength: { start: [50, 92], end: [35, 80] }     # by level
  rb_strength: { start: [55, 75], end: [40, 65] }  # the RB is a weaker blocker
  hold_max: 4          # seconds a 99 holds (owner: 4 at most)
  double: 0.6          # a second protector on the same drone adds this much
  strain: 0.6          # the beam flickers this long before the drone breaks free (the warning)
  engage: 0.5          # from the snap until the drones meet their protectors
  bust: { start: 0.0, end: 0.2 }   # how often a lineman whiffs on his man (a protection bust: that drone comes free)

# The box (owner, 2026-11-02): the drones on the line (front) and at the second level (back), no DBs, in a front
# picked by level: up to 8 in all. A line drone nearly always rushes (now and then an inside one drops out after the
# snap); a second-level drone is a threat: it may blitz (sometimes a beat late) or drop out, and may creep in before the
# snap (a tell). The more of the box that rushes against his 5 protectors and the RB, the more come free.
rush:
  boxes:
    - { id: "4-3", front: 4, back: 3, from: 1, weight: 3 }
    - { id: "3-3", front: 3, back: 3, from: 1, weight: 2 }
    - { id: "4-2", front: 4, back: 2, from: 1, weight: 2 }
    - { id: "3-4", front: 3, back: 4, from: 2, weight: 2 }
    - { id: "4-4", front: 4, back: 4, from: 4, weight: 2 }
    - { id: "5-3", front: 5, back: 3, from: 4, weight: 2 }
    - { id: "6-0", front: 6, back: 0, from: 5, weight: 1 }
    - { id: "5-2", front: 5, back: 2, from: 5, weight: 1.5 }
    - { id: "6-1", front: 6, back: 1, from: 7, weight: 1 }
    - { id: "7-0", front: 7, back: 0, from: 8, weight: 0.8 }
    - { id: "6-2", front: 6, back: 2, from: 9, weight: 1 }
  line: [6.5, 8]       # the line drones hover this far in front of him before the snap
  back_depth: [9.5, 11] # the second level, this far
  width: 4.2           # the line spreads this far each side of him
  back_width: 3.0      # the second level this far
  edge: 3.0            # an outermost line drone at least this far out is an edge: it goes around him
  blitz: { start: 0.2, end: 0.55 }       # how often a second-level drone blitzes
  front_drop: { start: 0.0, end: 0.15 }  # how often an inside line drone drops out instead
  honest: { start: 0.9, end: 0.65 }      # how often a blitzer creeps in before the snap (a dropper fakes it a little)
  delayed: { start: 0.0, end: 0.4 }      # how often a blitzer comes a beat late
  delay: [0.4, 0.9]    # how late

drones:
  height: 1.35         # they fly at chest height
  hit: 0.6             # closer than this, it gets him
  near: 1.8            # closer than this but not a hit: a near miss
  react: 0.25          # every play must be beatable by someone who reacts this long after a drone breaks free or locks on
  inside:              # an inside drone that breaks free (or comes free) darts at him: get off its line
    speed: { start: 5.0, end: 6.5 }        # breaking free from the line (a push, close to him)
    free_speed: { start: 8.0, end: 10.0 }  # unblocked from where it started (about 1 s)
    commit: { start: 0.85, end: 0.6 }      # it locks on (red) this long before it would reach him
    turn: 2.4
  edge:                # an edge that breaks free goes around him to the depth he stood at, chasing him sideways and
    speed: { start: 6.5, end: 8.5 }        # back: only a step up beats it (it overruns behind him)
    wide: 2.6          # how wide of him it swings
    behind: 1.0        # how far behind his spot it comes in from

friends:
  count: [3, 3, 4, 4, 4]   # by level (the last one holds); with the RB on a route, 5 at most (the toss buttons)
  depth: [13, 27]
  bearing: 46          # friends stand from -bearing to +bearing degrees across his view (all inside it)
  spacing: 16          # degrees between two friends at least
  rise: [-4, 3]        # their roofs sit this much below or above his
  watcher: { tight: 0.6, open: 3.4, change: 0.22 }   # each friend's watcher drone: on him, off him, how fast it moves
  lit: 0.8             # his lantern is lit once the watcher is this far (share of tight to open) off him
  snatch: 1.1          # a toss while the watcher is closer than this gets snatched: the run ends
  routes: { short: 17, long: 22 }   # nearer than short: a quick route; farther than long: deep; between: intermediate
  open:                # when each route's lantern lights, seconds after the snap
    quick: [1.8, 2.4]
    mid: [2.4, 3.2]
    deep: [3.2, 4.2]
  sooner: 0.25         # each drone rushing beyond 4 lights them this much sooner (fewer left to cover); fewer, later
  length: [1, 3]       # a lantern stays lit 1 to 3 s (owner)
  chance: { start: 0.65, end: 0.55 }   # how often a friend comes open at all (plus 10% for each drone rushing beyond 4)
  rb:                  # the RB running a route (sent out, or his threat dropped): a short throw on his own roof
    open: [1.3, 1.8]
    length: [1.2, 2.0]
    out: 3.2           # to this side of him (his blind side)
    depth: 3.6         # this far in front of where he starts (past the line)

toss:
  release: 0.12        # from the button to the package leaving his hand
  speed: 24

ramp:
  rounds_per_level: 3
  levels: 12
  restart_below: 2     # the next run starts this many levels below where the last one ended

scoring:
  delivery: 100        # a catch, times the streak
  quick: 40            # plus this much for each second before quick_until that he lets it go
  quick_until: 3.5
  missed: 30           # every lit lantern that goes out while he still holds the package (owner): minus this
  pickup: 40           # the RB picks up the blitzer he was kept in on
  near_miss: 25        # a drone that just misses him, times the streak
  clutch:              # it was on him when it locked on and he got clear only in the last moment: bonus, times the streak
    window: 0.3        # got clear this close to it passing (the later, the more: full points in the last half)
    points: 60
  streak_step: 0.25    # each catch in a row adds this to the streak multiplier
  streak_cap: 4

beats:
  result: 0.55         # after a catch, before the jump
  jump: 1.25           # the run and leap to the next roof
  over: 0.9            # after a hit or a snatch, before the run report

# Looks he earns with his best run (score). All drawn in code.
unlocks:
  jackets:
    - { id: street, name: Street, color: '#2B3242', at: 0 }
    - { id: volt, name: Volt, color: '#1E8F6E', at: 1500 }
    - { id: ember, name: Ember, color: '#B8432F', at: 4000 }
    - { id: royal, name: Royal, color: '#3D3FB0', at: 8000 }
    - { id: gold, name: Gold Rush, color: '#B98A1E', at: 15000 }
  trails:
    - { id: cyan, name: Cyan, color: '#3FE0FF', at: 0 }
    - { id: pink, name: Hot Pink, color: '#FF4FB8', at: 2500 }
    - { id: lime, name: Lime, color: '#A8FF3E', at: 6000 }
    - { id: white, name: White Heat, color: '#FFFFFF', at: 12000 }

reviewed: false        # the owner tunes these numbers by playing; nothing here is football
