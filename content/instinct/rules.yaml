# Pocket Instinct: the Pocket workout as the owner reworked it (2026-10-29, docs/plans/instinct.md). An endless
# run of snaps: he dodges hitters and throws to allies who come open, faster and harder each level, until a hitter
# gets him. Batch 5, not yet reviewed. His feet, the rush and what each move is come from content/pocket/rules.yaml
# (signed off); the free-blocking zone from content/field/geometry.yaml; the ball from content/tuning/drills.yaml.
# Distances in yards from the ball (x across, + = his right; y downfield), times in seconds after the snap.
version: 1
batch: 5

snap:
  set_depth: 6.0            # each snap he starts set, this far behind the ball
  catch: 0.35               # the ball reaches him; from then he can throw
  max_time: 6.0             # a snap ends here at the latest
  between: 0.9              # the pause before the next snap

# The rush. Four linemen across from his five, and a linebacker who may blitz. A blocked rusher meets his blocker
# at `meet`; what he does then is the snap's pattern.
rush:
  edge_start: { outside_tackle: 1.2, depth: 0.8 }
  inside_start: { x: 1.0, depth: 0.8 }
  blitz_start: { x: 2.5, depth: 4.5 }
  meet: 0.35
  open_late: 1.2           # in a collapse the edge rusher on the open side (ridden deep) wins this much later
  ride_speed: 3.0          # ...after his tackle runs him past the pocket this fast, opening the lane up and out
  # every snap the edge rusher on his off-hand side wins at `late` anyway: nobody holds the ball forever
  late: { start: 4.4, end: 3.4 }

# What the rush does on a snap (the right move is from PRD §6.7), from the level it first appears, and how often.
patterns:
  - { id: clean, from: 1, weight: 2, response: stand, terms: [clean-pocket] }
  - { id: edge, from: 1, weight: 3, response: climb, terms: [speed-rush, climb] }
  - { id: push, from: 1, weight: 3, response: pocket-slide, terms: [bull-rush, pocket-slide] }
  - { id: collapse, from: 3, weight: 2, response: pocket-escape, terms: [pocket-collapse, pocket-escape] }
  - { id: free, from: 4, weight: 2, response: ball-out, terms: [free-rusher, hot-route] }
# when the pressure would get him if he stood still: early levels to late levels
arrive: { start: [3.2, 3.8], end: [1.9, 2.5] }

# Allies: receivers working downfield, each with a shadow defender. An ally is open while his shadow has fallen
# off him (a window): open means room (tuning/drills.yaml reads.open_separation) when the ball leaves his hand.
# A shadow does not close back on an ally the ball is already in the air to.
allies:
  count: [3, 3, 4, 4, 4, 5]          # by level (the last value from then on)
  depth: [7, 16]
  margin: 4                          # kept this far inside the sidelines
  weave: { amplitude: [2, 4], period: [2.6, 3.8], depth: 1.2 }
  shadow: { tight: 0.9, open: 3.6, change: 0.35 }
  window:
    first: [0.9, 2.0]                # on a clean snap the first window opens in this range after the snap
    after_pressure: [-0.2, 0.6]      # under pressure it opens this long after standing still would have got him hit:
                                     # he has to move to be there for it
    hot: [0.5, 0.9]                  # against a free rusher the hot window opens this soon after he has the ball
    length: { start: 1.7, end: 0.9 } # windows get shorter level by level
    more: [0, 2]                     # extra windows later in the snap
  pick_reach: 1.2                    # a throw into a shadow this close is intercepted: the run ends

ramp:
  snaps_per_level: 3
  levels: 12                         # the ramp reaches its end values here
  rush_speed: { start: 0.85, end: 1.15 }
  blind_side: { start: 0.5, end: 0.8 }   # share of one-sided pressure from his off-hand side
  restart_below: 2                   # the next run starts this many levels below where the last one ended

scoring:
  hot_clock: 3.0                     # per ball, only this much of his time with it counts as hang time
  multiplier_step: 0.5               # each completion in a row adds this to the multiplier
reviewed: false
