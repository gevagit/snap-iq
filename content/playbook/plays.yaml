# Our playbook: the Inglewood Chargers 11U plays, read from the owner's PDF (2026-11-04). Football content, so every
# play is `reviewed: false` until the owner checks it against the PDF on the review page (npm run playbook:doc).
# The routine game (docs/plans/routine-v2.md) shuffles these plays.
#
# How a play is written:
#   qb: under | gun | pistol            where he takes the snap
#   kind: pass | play-action | screen | rpo | option | run
#   players: each player's side (left/right, as he sees it from the backfield), alignment word (`alignment` below)
#            and on_line. The five linemen are always LT LG C RG RT and are not listed.
#   motion: who moves before the snap, where to, and when he snaps it (the PDF's words)
#   routes: each receiver's route (the route words in content/offense/routes.yaml and `routes` below), with the
#           yards the PDF gives (`break`) and, for a crossing route, the side it ends on
#   ball: the ball carrier on a run; reads: his reads in order; checkdown; footwork; key: his key defender
#   protection: how the play blocks it, in the PDF's words; tags and notes: copied from the PDF
#   questions: what the PDF does not say, for the owner (answered questions move into the play)
#   reads / footwork / key may depend on the situation: `default`, `short` / `long` yardage, `must_convert`, `man`,
#   `zone`, `press`, `blitz` (the owner's answers, 2026-11-04)
#   cancelled: the owner took the play out of the game (kept here with his reason)
version: 1
batch: 7

# Alignment words beyond content/offense/formations.yaml (the numbers the review page and the game use).
alignment:
  wing: { outside_end_man: 1.2, depth: 1.0 }        # off the line, just outside the end man
  stack: { behind: 1.5 }                             # the second man of a stack lines up this far behind the first
  up-back: { x: 0, depth: 2.5 }                      # a back between the quarterback under center and the I-back
  beside-qb: { x: 1.6 }                              # a back beside the quarterback (gun, pistol full house), at his depth
  quads: { spacing: 3.5 }
  gaps: { A: 0.7, B: 2.1, C: 3.5, outside: 7 }         # where a run hits the line (x from the ball), by gap                            # four to one side: slot n (from the inside) stands n x this outside the end man
  reviewed: false

# Route words beyond content/offense/routes.yaml (waypoints as there: x toward his own sideline, y downfield).
routes:
  - { id: wheel-route, waypoints: [[3, 1], [6, 4], [6.5, 20]], quick: false, reviewed: false }
  - { id: bubble-route, waypoints: [[-1, -1.5], [3, -1], [6, 0]], quick: true, reviewed: false }
  - { id: comeback-route, waypoints: [[0, 12], [1.5, 10.5]], quick: false, reviewed: false }
  - { id: deep-cross-route, waypoints: [[0, 6], [-18, 14]], quick: false, reviewed: false }
  - { id: in-route, waypoints: [[0, 6], [-6, 6]], quick: true, reviewed: false }
  - { id: delay-out-route, waypoints: [[0, 0], [0, 4], [5, 4]], delay: 0.8, quick: false, reviewed: false }
  - { id: texas-route, waypoints: [[3.5, 1], [3.5, 3.5], [-1, 7]], quick: false, reviewed: false }   # owner: around the LT
  - { id: stalk-block, waypoints: [[0, 3]], block: true, reviewed: false }
  - { id: slip-screen, waypoints: [[-1, 0.3], [-1.6, 3]], quick: true, reviewed: false }   # slips through the line (owner: between C and RG)
  - { id: quick-screen-route, waypoints: [[0, 1], [-1.5, -0.5]], quick: true, reviewed: false }   # our "0": a yard up, then back toward the QB
  - { id: shallow-wheel-route, waypoints: [[2.5, 0.5], [5, 2], [5.5, 9]], quick: false, reviewed: false }
  - { id: skinny-post-route, waypoints: [[0, 6], [-2.5, 14]], quick: false, reviewed: false }
  - { id: deep-slant-route, waypoints: [[0, 3], [-7, 10]], quick: true, reviewed: false }
  - { id: chip-release-route, waypoints: [[1, 1.2], [5, 2], [8, 2.5]], quick: false, chip: 0.6, reviewed: false }
  - { id: arrow-route, waypoints: [[6, 2], [14, 4]], quick: true, reviewed: false }
  - { id: pass-block, waypoints: [[0, -0.6]], block: true, reviewed: false }
  - { id: down-block, waypoints: [[-1, 1]], block: true, reviewed: false }

plays:
  # ------------------------------------------------------------------------------------------------ 1
  - id: y-bluff
    number: 1
    name: Y Bluff
    qb: gun
    kind: play-action
    players:
      X: { side: left, align: wide, on_line: true }
      Z: { side: right, align: wide, on_line: true }
      H: { side: right, align: slot }
      Y: { side: right, align: spot, x: 1.4, depth: 2.7 }      # owner: 2 yards behind the RG
      RB: { side: right, align: beside-qb }
    routes:
      X: { route: go-route }
      Y: { route: seam-route, note: "between C and RG: the play is built for Y to break open in the middle" }
      Z: { route: slant-route, note: "mesh with H" }
      H: { route: wheel-route, note: "mesh with Z" }
      RB: { route: pass-block, note: "after the fake" }
    fake: RB
    footwork: three-step-drop
    reads:
      man: [X, Y]
      zone: [Z, H]
    key: "the DBs on the right (zone: pick the side of the mesh from their alignment)"
    protection: "fake handoff to the RB, who then blocks"
    tags: [goal-line, first-down]
    notes: "First down or goal line. Pretends like it's a handoff to the RB, then 3 step hit the concept based on coverage and blitz. No RPO. Owner: against man he can go X if he likes the matchup, or Y; against zone he picks the mesh on the right side from the DBs' alignment."
    reviewed: false

  # ------------------------------------------------------------------------------------------------ 2
  - id: gun-bread-and-dagger
    number: 2
    name: Gun Bread & Dagger
    qb: gun
    kind: pass
    players:
      X: { side: left, align: wide, on_line: true }
      Y: { side: right, align: slot }
      Z: { side: right, align: wide, on_line: true }
      RB: { side: left, align: beside-qb, depth: 6.5 }
      H: { side: right, align: beside-qb }
    routes:
      X: { route: go-route }
      RB: { route: swing-route }
      H: { route: shallow-wheel-route, note: "block, then release into a shallow wheel" }
      Y: { route: out-route, break: 10, note: "crosses Z's path on the break (dagger)" }
      Z: { route: go-route }
    footwork: three-step-drop
    reads:
      man: [X, RB]
      zone: [Y, Z]
    checkdown: [H, RB]
    protection: "Going left: H pass pro, then leak. Going right: RB pass pro."
    tags: [man, zone]
    notes: "QB is in shotgun. Protections: if going left use H to pass pro and leak, if going right, use RB for pass pro. 3 step throw or roll out. If man - go to left side (bread and butter), if zone, go to right side (dagger). H and RB are your checkdowns and inverse pass pro help."
    reviewed: false

