# Our playbook: the Inglewood Chargers 11U plays, read from the owner's PDF (2026-11-04). Football content, so every
# play is `reviewed: false` until the owner checks it against the PDF on the review page (npm run playbook:doc).
# The routine game (docs/plans/routine-v2.md) shuffles these plays.
#
# How a play is written:
#   qb: under | gun | pistol            where he takes the snap
#   kind: pass | play-action | screen | rpo | option | run
#   players: each player's side (left/right, as he sees it from the backfield), alignment word (`alignment` below)
#            and on_line. The five linemen are always LT LG C RG RT and are not listed.
#   motion: who moves before the snap, where to, and when he snaps it (the PDF's words)
#   routes: each receiver's route (the route words in content/offense/routes.yaml and `routes` below), with the
#           yards the PDF gives (`break`) and, for a crossing route, the side it ends on
#   ball: the ball carrier on a run; reads: his reads in order; checkdown; footwork; key: his key defender
#   protection: how the play blocks it, in the PDF's words; tags and notes: copied from the PDF
#   questions: what the PDF does not say, for the owner (answered questions move into the play)
version: 1
batch: 7

# Alignment words beyond content/offense/formations.yaml (the numbers the review page and the game use).
alignment:
  wing: { outside_end_man: 1.2, depth: 1.0 }        # off the line, just outside the end man
  stack: { behind: 1.5 }                             # the second man of a stack lines up this far behind the first
  up-back: { x: 0, depth: 2.5 }                      # a back between the quarterback under center and the I-back
  beside-qb: { x: 1.6 }                              # a back beside the quarterback (gun, pistol full house), at his depth
  quads: { spacing: 3.5 }                            # four to one side: slot n (from the inside) stands n x this outside the end man
  reviewed: false

# Route words beyond content/offense/routes.yaml (waypoints as there: x toward his own sideline, y downfield).
routes:
  - { id: wheel-route, waypoints: [[3, 1], [6, 4], [6.5, 20]], quick: false, reviewed: false }
  - { id: bubble-route, waypoints: [[-1, -1.5], [3, -1], [6, 0]], quick: true, reviewed: false }
  - { id: comeback-route, waypoints: [[0, 12], [1.5, 10.5]], quick: false, reviewed: false }
  - { id: deep-cross-route, waypoints: [[0, 6], [-18, 14]], quick: false, reviewed: false }
  - { id: in-route, waypoints: [[0, 6], [-6, 6]], quick: true, reviewed: false }
  - { id: delay-out-route, waypoints: [[0, 0], [0, 4], [5, 4]], delay: 0.8, quick: false, reviewed: false }
  - { id: texas-route, waypoints: [[2, 1.5], [0, 4], [-4, 7]], quick: false, reviewed: false }
  - { id: stalk-block, waypoints: [[0, 3]], block: true, reviewed: false }
  - { id: slip-screen, waypoints: [[1, -1], [-4, -2]], quick: true, reviewed: false }

plays:
  # ------------------------------------------------------------------------------------------------ 1
  - id: y-bluff
    number: 1
    name: Y Bluff
    qb: under
    kind: play-action
    players:
      X: { side: left, align: wide, on_line: true }
      H: { side: right, align: wing }
      Z: { side: right, align: wide, on_line: true }
      Y: { side: middle, align: up-back }
      RB: { side: right, align: beside-qb, depth: 2.5 }
    routes:
      X: { route: go-route }
      Y: { route: seam-route, note: "fake block, break forward between C and RG" }
      H: { route: wheel-route }
      Z: { route: in-route, note: "mesh with H on the right side" }
    footwork: three-step-drop
    fake: RB
    reads: null
    protection: "fake handoff to the RB, then 3-step"
    tags: [goal-line, first-down]
    notes: "First down or goal line. Pretends like it's a handoff to the RB, then 3 step hit the concept based on coverage and blitz. No RPO."
    questions:
      - "Which receiver is his first read against man, and against zone?"
      - "Is the RB a blocker after the fake, or a checkdown?"
    reviewed: false

