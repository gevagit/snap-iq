      X: { side: left, align: wide, on_line: true }
      Y: { side: right, align: slot }
      Z: { side: right, align: wide, on_line: true }
      RB: { side: left, align: beside-qb, depth: 6.5 }
      H: { side: right, align: beside-qb }
    routes:
      X: { route: go-route }
      RB: { route: swing-route }
      H: { route: wheel-route, note: "block, then release into a wheel" }
      Y: { route: out-route, break: 10, note: "crosses Z's path on the break (dagger)" }
      Z: { route: go-route }
    footwork: three-step-drop
    reads:
      man: [X, RB]
      zone: [Y, Z]
    checkdown: [H, RB]
    protection: "Going left: H pass pro, then leak. Going right: RB pass pro."
    tags: [man, zone]
    notes: "QB is in shotgun. Protections: if going left use H to pass pro and leak, if going right, use RB for pass pro. 3 step throw or roll out. If man - go to left side (bread and butter), if zone, go to right side (dagger). H and RB are your checkdowns and inverse pass pro help."
    questions:
      - "On the left (bread and butter) against man: X streak first, then the RB swing?"
      - "The PDF draws Y and Z both on the line, which puts 8 on it. I put Y off the line: right?"
    reviewed: false

